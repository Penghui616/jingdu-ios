name: Build sideload IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
      - name: Build iPhone application without distribution signing
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1 || { tail -n 100 build.log; exit 1; }
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          test -f Payload/App.app/public/data/cus.json
          test -f Payload/App.app/public/native.js
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/App.app/Info.plist
          ditto -c -k --sequesterRsrc --keepParent Payload Jingdu-unsigned.ipa
          shasum -a 256 Jingdu-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jingdu-sideload
          path: |
            Jingdu-unsigned.ipa
            SHA256SUMS.txt
          retention-days: 7
      - name: Launch in iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -n 80 simulator-build.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-simulator/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" io.github.penghui616.jingdu
          sleep 15
          xcrun simctl io "$DEVICE" screenshot iphone-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-check
          path: |
            iphone-launch.png
            simulator-build.log
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 3
